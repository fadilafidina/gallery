<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- plate -->
  <rect x="1" y="13" width="14" height="1" fill="#e9eef2"/>
  <rect x="2" y="14" width="12" height="1" fill="#b9c4cc"/>
  <!-- bottom pancake -->
  <rect x="2" y="10" width="12" height="1" fill="#f2b766"/>
  <rect x="1" y="11" width="14" height="1" fill="#d98b3a"/>
  <rect x="2" y="12" width="12" height="1" fill="#a85e22"/>
  <!-- middle pancake -->
  <rect x="2" y="7" width="12" height="1" fill="#f2b766"/>
  <rect x="1" y="8" width="14" height="1" fill="#d98b3a"/>
  <rect x="2" y="9" width="12" height="1" fill="#a85e22"/>
  <!-- top pancake -->
  <rect x="3" y="4" width="10" height="1" fill="#f7c97e"/>
  <rect x="2" y="5" width="12" height="1" fill="#f2b766"/>
  <rect x="1" y="6" width="14" height="1" fill="#d98b3a"/>
  <!-- syrup pool + drips -->
  <rect x="4" y="4" width="8" height="1" fill="#8a3b12"/>
  <rect x="3" y="5" width="10" height="1" fill="#8a3b12"/>
  <rect x="3" y="6" width="1" height="2" fill="#8a3b12"/>
  <rect x="9" y="6" width="1" height="1" fill="#8a3b12"/>
  <rect x="12" y="6" width="1" height="4" fill="#8a3b12"/>
  <rect x="5" y="5" width="2" height="1" fill="#b4561f"/>
  <!-- butter -->
  <rect x="6" y="2" width="4" height="2" fill="#ffe27a"/>
  <rect x="6" y="2" width="2" height="1" fill="#fff4bf"/>
  <rect x="6" y="3" width="4" height="1" fill="#e9c24a"/>
</svg>
